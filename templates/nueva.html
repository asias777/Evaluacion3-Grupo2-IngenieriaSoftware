{% extends 'base.html' %}{% block title %}Nueva solicitud{% endblock %}{% block content %}
<a class="back" href="/solicitudes">← Volver a solicitudes</a><div class="heading"><div><div class="eyebrow">RF-01 · REGISTRO</div><h1>Nueva solicitud</h1><p>Describe el trabajo técnico que necesitas solicitar.</p></div></div>
<section class="panel form-panel"><form method="post" action="/solicitudes/nueva"><input type="hidden" name="csrf" value="{{csrf}}"><label>Título de la solicitud *</label><input name="titulo" minlength="5" maxlength="120" placeholder="Ej. Reparación de tablero eléctrico" required><label>Descripción detallada *</label><textarea name="descripcion" minlength="10" maxlength="2000" rows="6" placeholder="Indica el problema, síntomas y condiciones del lugar" required></textarea><div class="two"><div><label>Ubicación *</label><input name="ubicacion" minlength="3" maxlength="180" placeholder="Sector / faena" required></div><div><label>Prioridad propuesta *</label><select name="prioridad" required><option>Media</option><option>Baja</option><option>Alta</option><option>Crítica</option></select></div></div><button class="primary">Registrar requerimiento</button></form></section>
{% endblock %}
